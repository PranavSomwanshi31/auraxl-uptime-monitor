services:
  - type: web
    name: auraxl-uptime-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TARGET_URL
        value: https://auraxl.com
      - key: MONITOR_INTERVAL_MINUTES
        value: "5"
      - key: REQUEST_TIMEOUT_MS
        value: "10000"
      - key: DEGRADED_RESPONSE_TIME_MS
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: auraxl-uptime-db
          property: connectionString
      - key: MANUAL_CHECK_TOKEN
        generateValue: true

databases:
  - name: auraxl-uptime-db
    databaseName: auraxl_uptime
    user: auraxl_uptime_user
    plan: free
